<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="theme-color" content="#0a0e13">
<title>Parade State</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0a0e13;
    --panel: #121a22;
    --panel-2: #0d131a;
    --border: #22303d;
    --text: #e8eef4;
    --text-dim: #7c8b99;
    --text-faint: #4d5a66;
    --in: #3ecf8e;
    --out: #f2664a;
    --onduty: #f0b429;
    --leave: #ba8cf2;
    --mc: #5b9cf6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 0;
    overscroll-behavior-y: contain;
  }
  input, select, textarea { font-size: 16px; font-family: inherit; }
  #app { max-width: 480px; margin: 0 auto; padding: 10px 12px 70px; }

  .maintabs { display: flex; gap: 6px; margin-bottom: 12px; position: sticky; top: 0; background: var(--bg); padding-top: 4px; z-index: 5; }
  .maintab {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; padding: 9px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; cursor: pointer;
  }
  .maintab.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  h2 { font-size: 14px; letter-spacing: 0.03em; margin: 0; }
  .sectionhead { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 10px; }
  .pshead-btns { display: flex; gap: 6px; }
  .refresh-ts { font-size: 9.5px; color: var(--text-faint); text-align: right; margin-top: 2px; }

  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .statcard { background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 10px 8px; text-align: center; }
  .statval { font-size: 19px; font-weight: 600; }
  .statlabel { font-size: 9.5px; color: var(--text-dim); letter-spacing: 0.06em; margin-top: 2px; }
  .statcard.in .statval { color: var(--in); }
  .statcard.out .statval { color: var(--out); }
  .statcard.onduty .statval { color: var(--onduty); }
  .statcard.leave .statval { color: var(--leave); }
  .statcard.mc .statval { color: var(--mc); }
  .statusline { font-size: 12.5px; color: var(--out); margin-bottom: 14px; letter-spacing: 0.02em; }

  .btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.03em; cursor: pointer; }
  .btn.full { width: 100%; }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 8px 12px; font-size: 11.5px; }
  .btn.danger { background: var(--out); color: #2a0e08; border-color: var(--out); }
  .savebtn.dirty { background: var(--in); color: #06251a; border-color: var(--in); }
  .export-row { margin-bottom: 10px; }

  .segmented { display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 3px; margin-bottom: 10px; gap: 3px; }
  .seg-btn { flex: 1; text-align: center; padding: 9px 4px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--text-dim); cursor: pointer; }
  .seg-btn.active { background: var(--text); color: var(--bg); }
  .seg-btn .count { opacity: 0.7; font-weight: 500; }

  .date-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .date-display { font-size: 12.5px; color: var(--text-dim); }
  .date-row.alt-date .date-display { color: var(--out); }
  .date-badge { font-size: 9px; background: var(--out); color: #2a0e08; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-left: 4px; }

  .selector-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .selector-row label { font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.06em; width: 34px; flex-shrink: 0; }
  .selector-row select, .selector-row input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 10px; }
  .selector-static { flex: 1; background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); border-radius: 8px; padding: 9px 10px; font-size: 12.5px; }

  .chiprow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); border-radius: 20px; padding: 6px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; cursor: pointer; }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .press-hint { font-size: 11px; color: var(--out); letter-spacing: 0.02em; margin: -2px 0 12px 2px; }

  .group { margin-bottom: 14px; }
  .group-title { font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.08em; margin-bottom: 6px; padding-left: 2px; }
  .emp-grid { display: flex; flex-direction: column; gap: 6px; }
  .empty-hint { color: var(--text-faint); font-size: 12.5px; padding: 20px 4px; text-align: center; }

  .emprow { position: relative; overflow: hidden; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--in); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; user-select: none; touch-action: pan-y; cursor: pointer; }
  .emprow.out { border-left-color: var(--out); }
  .emprow.onduty { border-left-color: var(--onduty); }
  .emprow.leave { border-left-color: var(--leave); }
  .emprow.mc { border-left-color: var(--mc); }
  .emprow.armed { background: #1a1210; }
  .emprow.excluded { opacity: 0.45; border-left-color: var(--text-faint); }
  .emprow.readonly { cursor: default; }
  .emprow .name { font-size: 13.5px; }
  .emprow .rank { color: var(--text-dim); font-size: 11px; margin-right: 6px; }
  .emprow .badge { font-size: 8.5px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px; padding: 1px 5px; margin-left: 4px; letter-spacing: 0.04em; }
  .emprow .substatus { font-size: 11px; color: var(--text-dim); text-align: right; }
  .emprow.out .substatus, .emprow.armed .substatus { color: var(--out); }
  .emprow.onduty .substatus { color: var(--onduty); }
  .emprow.leave .substatus { color: var(--leave); }
  .emprow.mc .substatus { color: var(--mc); }
  .emprow.pressing::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0.06); transform: scaleX(0); transform-origin: left; animation: pressfill 480ms linear forwards; }
  @keyframes pressfill { to { transform: scaleX(1); } }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-sheet { background: var(--panel); border: 1px solid var(--border); border-radius: 14px 14px 0 0; padding: 18px 16px 22px; width: 100%; max-width: 480px; max-height: 86vh; overflow-y: auto; }
  .modal-sheet h3 { margin: 0 0 4px; font-size: 15px; }
  .modal-sheet .sub { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .reason-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
  .reason-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 12px 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .modal-close { background: transparent; border: none; color: var(--text-dim); width: 100%; text-align: center; padding: 12px; font-size: 12px; letter-spacing: 0.04em; cursor: pointer; }
  .field-row { margin-bottom: 12px; }
  .field-row label { display: block; font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.06em; margin-bottom: 5px; }
  .field-row input, .field-row select { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px; }
  .field-row-2 { display: flex; gap: 8px; }
  .field-row-2 .field-row { flex: 1; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-row input[type=checkbox] { width: 18px; height: 18px; }

  .list-row { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; }
  .list-row .name { font-size: 13px; }
  .list-row .meta { font-size: 10.5px; color: var(--text-faint); }

  .bulk-textarea { width: 100%; min-height: 90px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 16px; padding: 10px; resize: vertical; outline: none; }
  .bulk-list { max-height: 300px; overflow-y: auto; margin-bottom: 6px; }
  .bulk-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; }
  .bulk-name { flex: 1 1 100%; font-size: 12.5px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bulk-row select { flex: 1 1 45%; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; padding: 7px 8px; min-width: 0; outline: none; }
  .bulk-remove { background: transparent; border: 1px solid var(--border); color: var(--out); border-radius: 6px; width: 30px; height: 30px; flex-shrink: 0; cursor: pointer; font-size: 15px; }

  .datarow { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--in); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .datarow.fp { border-left-color: var(--in); }
  .datarow.lp { border-left-color: var(--mc); }
  .datarow.stayin { border-left-color: var(--leave); }
  .datarow .title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .datarow .line2 { font-size: 10.5px; color: var(--text-dim); }
  .check-row { display: flex; gap: 18px; margin-bottom: 16px; flex-wrap: wrap; }
  .check-label { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-dim); }
  .back-link { background: transparent; border: none; color: var(--text-dim); font-size: 12px; padding: 6px 0 14px; cursor: pointer; display: block; }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--in); color: #06251a; font-size: 12.5px; font-weight: 600; padding: 10px 18px; border-radius: 20px; opacity: 0; transition: all 0.25s ease; z-index: 60; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .export-textarea { width: 100%; min-height: 320px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: inherit; font-size: 16px; line-height: 1.5; padding: 10px; white-space: pre; resize: vertical; }

  .banner { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 11px; color: var(--text-faint); margin-bottom: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">

<script>

  };

  ];

    { id: 'e5', rank: 'PTE', name: 'Julian', subUnit: 'S1 BR', isCDS: false, isExcluded: false, isORD: false, isStayIn: false },
    { id: 'e6', rank: '3SG', name: 'Anthony', subUnit: 'S1 BR', isCDS: false, isExcluded: false, isORD: false, isStayIn: true },
    { id: 'e7', rank: 'PTE', name: 'Shawn', subUnit: 'S2 BR', isCDS: false, isExcluded: false, isORD: false, isStayIn: false },
    { id: 'e8', rank: 'CPL', name: 'Hafizuddin', subUnit: 'S2 BR', isCDS: false, isExcluded: false, isORD: false, isStayIn: false }
  ];
  var SEED_SUPERIORS = [
    { id: 's1', rank: 'CPT', name: 'Lim', subUnit: 'HQ COY', isCDO: true },
    { id: 's2', rank: '2LT', name: 'Tan', subUnit: 'S1 BR', isCDO: false }
  ];

  // ================= INDEXEDDB DATA LAYER =================
  var DB_NAME = 'paradeStateApp';
  var DB_VERSION = 3;
  var db = null;

  function openDB() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains('subUnits')) d.createObjectStore('subUnits', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('employees')) d.createObjectStore('employees', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('superiors')) d.createObjectStore('superiors', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('attendance')) d.createObjectStore('attendance', { keyPath: 'key' }); // key = date|empId|session
        if (!d.objectStoreNames.contains('dailyDuty')) d.createObjectStore('dailyDuty', { keyPath: 'date' });
        if (!d.objectStoreNames.contains('paradeHistory')) d.createObjectStore('paradeHistory', { keyPath: 'key' }); // key = date|session
        if (!d.objectStoreNames.contains('absenceRecords')) d.createObjectStore('absenceRecords', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
        if (!d.objectStoreNames.contains('timePresets')) d.createObjectStore('timePresets', { keyPath: 'id' });
      };
      req.onsuccess = function (e) { db = e.target.result; resolve(db); };
      req.onerror = function (e) { reject(e); };
    });
  }
  function idbGetAll(storeName) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, 'readonly');
      var req = tx.objectStore(storeName).getAll();
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function (e) { reject(e); };
    });
  }
  function idbGet(storeName, key) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, 'readonly');
      var req = tx.objectStore(storeName).get(key);
      req.onsuccess = function () { resolve(req.result || null); };
      req.onerror = function (e) { reject(e); };
    });
  }
  function idbBulkPut(storeName, values) {
    return new Promise(function (resolve, reject) {
      if (!values.length) return resolve();
      var tx = db.transaction(storeName, 'readwrite');
      var store = tx.objectStore(storeName);
      values.forEach(function (v) { store.put(v); });
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function (e) { reject(e); };
    });
  }
  function idbDelete(storeName, key) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(key);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function (e) { reject(e); };
    });
  }
  function idbClear(storeName) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).clear();
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function (e) { reject(e); };
    });
  }

  // ================= DATE HELPERS (ported exactly) =================
  function todayIso_() {
    var d = new Date();
    var pad = function (v) { return (v < 10 ? '0' : '') + v; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function formatDDMMYY_(iso) {
    var parts = iso.split('-');
    if (parts.length !== 3) return '';
    return parts[2] + parts[1] + parts[0].slice(2);
  }
  function ddmmyyToIso_(ddmmyy) {
    if (!/^\d{6}$/.test(ddmmyy)) return '';
    return '20' + ddmmyy.slice(4, 6) + '-' + ddmmyy.slice(2, 4) + '-' + ddmmyy.slice(0, 2);
  }
  function weekdayDatesFrom_(startIso, dayCount) {
    var dates = [];
    var d = new Date(startIso + 'T00:00:00');
    var pad = function (v) { return (v < 10 ? '0' : '') + v; };
    function pushCurrent() { dates.push(d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())); }
    pushCurrent();
    var counted = 1;
    while (counted < dayCount) {
      d.setDate(d.getDate() + 1);
      var dow = d.getDay();
      if (dow !== 0 && dow !== 6) { pushCurrent(); counted++; }
    }
    return dates;
  }
  function addWeekdaysIso_(startIso, dayCount) {
    var dates = weekdayDatesFrom_(startIso, dayCount);
    return dates[dates.length - 1];
  }
  function countWeekdaysBetween_(startIso, endIso) {
    var start = new Date(startIso + 'T00:00:00');
    var end = new Date(endIso + 'T00:00:00');
    if (end < start) return 1;
    var count = 1;
    var d = new Date(start);
    while (d < end) {
      d.setDate(d.getDate() + 1);
      var dow = d.getDay();
      if (dow !== 0 && dow !== 6) count++;
    }
    return count;
  }
  /** Keeps {days, startDate, endDate} internally consistent regardless of
   *  which one the user just edited — pick either direction: set Days and
   *  the end date follows, or set an End date directly and Days follows.
   *  Returns the updated {days, startDate, endDate}. Editing 'end' snaps the
   *  result back through addWeekdaysIso_ so the stored end date always lands
   *  on a real weekday boundary consistent with the day count — typing a
   *  Saturday, say, resolves to whichever weekday actually completes that
   *  many working days from the start. */
  function reconcileDateRange_(state, changedField) {
    var days = state.days, startDate = state.startDate, endDate = state.endDate;
    if (changedField === 'end') {
      if (startDate && endDate) {
        days = countWeekdaysBetween_(startDate, endDate);
        endDate = addWeekdaysIso_(startDate, days);
      }
    } else {
      // 'days' or 'start' changed — end date follows, keeping the duration fixed
      endDate = startDate ? addWeekdaysIso_(startDate, days) : '';
    }
    return { days: days, startDate: startDate, endDate: endDate };
  }
  function previousDayIso_(iso) {
    var d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() - 1);
    var pad = function (v) { return (v < 10 ? '0' : '') + v; };

  function datesReasonNames_() {

  function buildDatesReasonString_(reasonName, days, startDate) {
    if (!startDate) return { ok: false, message: 'Please fill in the start date for this ' + reasonName + '.' };
    if (days > 1) {

      return { ok: true, value: days + 'D ' + reasonName + ' ' + formatDDMMYY_(startDate) + '-' + formatDDMMYY_(endDate) };
    }

  function buildTextReasonString_(reasonName, text, placeholder) {
    var trimmed = (text || '').trim();

    return { ok: true, value: reasonName + ' ' + trimmed };
  }
  function buildTextDatesReasonString_(reasonName, text, days, startDate) {
    var trimmed = (text || '').trim();
    if (!trimmed) return { ok: false, message: 'Please fill in the course name for this ' + reasonName + '.' };
    if (!startDate) return { ok: false, message: 'Please fill in the start date for this ' + reasonName + '.' };
    if (days > 1) {
      var endDate = addWeekdaysIso_(startDate, days);
      return { ok: true, value: days + 'D ' + reasonName + ' ' + trimmed + ' ' + formatDDMMYY_(startDate) + '-' + formatDDMMYY_(endDate) };

    return { ok: true, value: reasonName + ' ' + trimmed + ' ' + formatDDMMYY_(startDate) };

  function parseAnyMultiDayReason_(reasonStr) {
    if (!reasonStr) return null;
    var names = datesReasonNames_();
    for (var i = 0; i < names.length; i++) {
      var escaped = names[i].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var m = reasonStr.match(new RegExp('^(\\d+)D ' + escaped + ' (\\d{6})-(\\d{6})$'));
      if (m) return { reasonName: names[i], startDate: ddmmyyToIso_(m[2]), endDate: ddmmyyToIso_(m[3]) };

  function coversDate_(rec, dateStr) {

  /** Recovers the base reason name (e.g. 'MC', 'OOC', 'GD') from any stored

   *  'OOC Bedok Camp'). Needed so category-based logic (like Stay-in
   *  Strength's carry-forward rules) can work from just the attendance
   *  record's reason string, without threading a separate reasonName field
   *  through every call site that sets attendance. */
  function baseReasonNameOf_(reasonStr) {
    if (!reasonStr) return '';
    if (REASON_BUCKET.hasOwnProperty(reasonStr)) return reasonStr;
    var stripped = reasonStr.replace(/^\d+D /, '');
    var allNames = Object.keys(REASON_BUCKET).slice().sort(function (a, b) { return b.length - a.length; });
    for (var i = 0; i < allNames.length; i++) {

    return '';
  }

  // ================= tap / long-press / scroll-vs-tap (shared with Stay-in) =================
  function bindEmpRowEvents_() {
    var MOVE_CANCEL_PX = 10;
    document.querySelectorAll('.emprow').forEach(function (row) {
      var empId = row.getAttribute('data-emp');
      if (row.classList.contains('excluded')) {
        var exStartX = 0, exStartY = 0, exMoved = false;
        row.addEventListener('pointerdown', function (ev) { exStartX = ev.clientX; exStartY = ev.clientY; exMoved = false; });
        row.addEventListener('pointermove', function (ev) {
          if (exMoved) return;
          var dx = ev.clientX - exStartX, dy = ev.clientY - exStartY;
          if (Math.sqrt(dx * dx + dy * dy) > MOVE_CANCEL_PX) exMoved = true;
        });
        row.addEventListener('pointerup', function () { if (!exMoved) restoreEmployee_(empId); });
        return;
      }
      var timer = null, fired = false, moved = false, startX = 0, startY = 0;
      row.addEventListener('pointerdown', function (ev) {
        fired = false; moved = false; startX = ev.clientX; startY = ev.clientY;
        row.classList.add('pressing');
        timer = setTimeout(function () {
          fired = true;
          row.classList.remove('pressing');
          if (pendingOut.empId === empId) { clearTimeout(pendingOutTimer); pendingOut = { empId: null, session: null }; }
          openReasonModal(empId);
        }, 480);
      });
      row.addEventListener('pointermove', function (ev) {
        if (moved || fired) return;
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (Math.sqrt(dx * dx + dy * dy) > MOVE_CANCEL_PX) { moved = true; clearTimeout(timer); row.classList.remove('pressing'); }
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (evt) {
        row.addEventListener(evt, function () {
          clearTimeout(timer);
          row.classList.remove('pressing');
          if (evt === 'pointerup' && !fired && !moved) toggleEmpLocal(empId);
        });
      });
      row.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    });
  }
  function toggleEmpLocal(empId) {

        render();

    if (!e) return;
    detailReasonName = ''; detailDays = 1; detailStartDate = APP.date; detailEndDate = APP.date; detailText = '';
    renderReasonModal(empId, e);
  }
  function renderReasonModal(empId, e) {
    var plainReasons = DEFAULT_REASONS.map(function (r) { return r[0]; })
      .filter(function (r) { return reasonAvailableForSession_(r) && (session !== 'STAYIN' || (r !== 'AM MA' && r !== 'PM MA')); });
    var html;
    if (detailReasonName) {
      var cfg = REASONS_WITH_DETAIL[detailReasonName];
      html = '<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet">' +
        '<h3>' + esc(e.rank) + ' ' + esc(e.name) + '</h3><div class="sub">' + esc(detailReasonName) + '</div>';
      if (cfg.type === 'text' || cfg.type === 'text-dates') {
        html += '<div class="field-row"><label>' + esc(cfg.placeholder) + '</label><input type="text" id="detailTextInput" value="' + esc(detailText) + '"></div>';
      }
      if (cfg.type === 'dates' || cfg.type === 'text-dates') {
        html += '<div class="field-row-2">' +
          '<div class="field-row"><label>Days</label><input type="number" id="detailDaysInput" min="1" value="' + detailDays + '"></div>' +
          '<div class="field-row"><label>Start date</label><input type="date" id="detailStartInput" value="' + esc(detailStartDate) + '"></div>' +
          '</div>' +
          '<div class="field-row"><label>End date</label><input type="date" id="detailEndInput" value="' + esc(detailEndDate) + '"></div>';
      }
      html += '<button class="btn full" id="detailConfirmBtn" style="margin-bottom:8px;">CONFIRM</button>' +
        '<button class="btn ghost full" id="removeFromParadeBtn" style="margin-bottom:8px;">REMOVE FROM PARADE STATE</button>' +
        '<button class="modal-close" id="modalClose">CANCEL</button></div></div>';
    } else {
      html = '<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet">' +
        '<h3>' + esc(e.rank) + ' ' + esc(e.name) + '</h3><div class="sub">Choose a reason</div>' +
        '<div class="reason-grid">' + plainReasons.map(function (r) {
          return '<button class="reason-btn" data-reason="' + esc(r) + '">' + esc(r) + '</button>';
        }).join('') + '</div>' +
        '<button class="btn full ghost" id="btnMarkIn" style="margin:10px 0 8px;">MARK IN</button>' +
        '<button class="btn ghost full" id="removeFromParadeBtn" style="margin-bottom:8px;">REMOVE FROM PARADE STATE</button>' +
        '<button class="modal-close" id="modalClose">CANCEL</button></div></div>';
    }
    document.getElementById('modalRoot').innerHTML = html;
    document.getElementById('modalOverlay').addEventListener('click', function (ev) { if (ev.target.id === 'modalOverlay') closeModal(); });
    document.getElementById('modalClose').addEventListener('click', closeModal);
    var removeBtn = document.getElementById('removeFromParadeBtn');
    if (removeBtn) removeBtn.addEventListener('click', function () { removeFromParadeState_(empId); closeModal(); });

    if (detailReasonName) {
      var cfg2 = REASONS_WITH_DETAIL[detailReasonName];
      var ti = document.getElementById('detailTextInput'); if (ti) ti.addEventListener('input', function () { detailText = ti.value; });
      var di = document.getElementById('detailDaysInput');
      if (di) di.addEventListener('change', function () {
        detailDays = parseInt(di.value, 10) || 1;
        var r = reconcileDateRange_({ days: detailDays, startDate: detailStartDate, endDate: detailEndDate }, 'days');
        detailDays = r.days; detailEndDate = r.endDate;
        renderReasonModal(empId, e);
      });
      var si = document.getElementById('detailStartInput');
      if (si) si.addEventListener('change', function () {
        detailStartDate = si.value;
        var r = reconcileDateRange_({ days: detailDays, startDate: detailStartDate, endDate: detailEndDate }, 'start');
        detailDays = r.days; detailEndDate = r.endDate;
        renderReasonModal(empId, e);
      });
      var eiInput = document.getElementById('detailEndInput');
      if (eiInput) eiInput.addEventListener('change', function () {
        detailEndDate = eiInput.value;
        var r = reconcileDateRange_({ days: detailDays, startDate: detailStartDate, endDate: detailEndDate }, 'end');
        detailDays = r.days; detailEndDate = r.endDate;
        renderReasonModal(empId, e);
      });
      document.getElementById('detailConfirmBtn').addEventListener('click', function () {
        var result = cfg2.type === 'dates' ? buildDatesReasonString_(detailReasonName, detailDays, detailStartDate)
          : cfg2.type === 'text-dates' ? buildTextDatesReasonString_(detailReasonName, detailText, detailDays, detailStartDate)
          : buildTextReasonString_(detailReasonName, detailText, cfg2.placeholder);
        if (!result.ok) { showToast(result.message); return; }
        var bucket = bucketForReasonLocal(detailReasonName);
        var syncStartDate = (cfg2.type === 'dates' || cfg2.type === 'text-dates') ? detailStartDate : APP.date;
        var syncDays = (cfg2.type === 'dates' || cfg2.type === 'text-dates') ? detailDays : 1;
        var currentRec = attFor(empId, session);
        if (currentRec.reason && currentRec.reason !== result.value) {
          closeModal();

  function applyReasonToEmp_(empId, reasonName, reasonStr, bucket, startDate, days) {

    syncAbsenceRecordForLocal_(empId, reasonName, reasonStr, startDate, days);
    render();
  }

  // ================= SAVE / SNAPSHOT =================
  function buildSnapshot(sess) {
    var isStayIn = sess === 'STAYIN';
    var counts = paradeCounts(sess);
    var activeEmployees = APP.employees.filter(function (e) { return isActiveForParade_(e) && (!isStayIn || isTrue(e.isStayIn)); });
    var total = activeEmployees.length;
    var cdsId = isStayIn ? APP.dailyDuty.stayInCdsEmployeeId : APP.dailyDuty.cdsEmployeeId;
    var cdsEmp = APP.employees.filter(function (e) { return e.id === cdsId; })[0];
    var cdoSup = isStayIn ? null : APP.superiors.filter(function (s) { return s.id === APP.dailyDuty.cdoSuperiorId; })[0];
    var people = activeEmployees.map(function (e) {
      var a = attFor(e.id, sess);
      return { id: e.id, rank: e.rank, name: e.name, subUnit: e.subUnit, status: a.bucket === 'In' ? 'Present' : 'Absent', reason: a.reason || '', bucket: a.bucket };
    });
    var defaultTime = sess === 'AM' ? '0745HRS' : '1715HRS';
    var customTime = sess === 'AM' ? APP.dailyDuty.amTimeLabel : sess === 'PM' ? APP.dailyDuty.pmTimeLabel : '';
    return {
      date: APP.date, session: sess,
      label: isStayIn ? 'STAYIN' : (sess === 'AM' ? 'FP' : 'LP'),
      timeLabel: isStayIn ? '' : (customTime || defaultTime),
      cds: cdsEmp ? (cdsEmp.rank + ' ' + cdsEmp.name) : '',
      cdo: cdoSup ? (cdoSup.rank + ' ' + cdoSup.name) : '',
      total: total, present: counts.In, people: people
    };
  }

  async function saveChanges() {
    var attendanceRows = [];
    dirtyKeys.forEach(function (key) {
      var parts = key.split('|');
      var empId = parts[0], sess = parts[1];
      var a = attFor(empId, sess);
      attendanceRows.push({ key: APP.date + '|' + empId + '|' + sess, date: APP.date, empId: empId, session: sess, status: a.status, reason: a.reason, bucket: a.bucket, updatedAt: new Date().toISOString() });
    });
    if (attendanceRows.length) await idbBulkPut('attendance', attendanceRows);
    if (dailyDutyDirty) await idbBulkPut('dailyDuty', [Object.assign({ date: APP.date }, APP.dailyDuty)]);

    var snap = buildSnapshot(session);
    var historyRow = { key: APP.date + '|' + session, date: APP.date, session: session, snapshot: snap, savedAt: new Date().toISOString() };
    await idbBulkPut('paradeHistory', [historyRow]);
    var idx = historyList.findIndex(function (h) { return h.key === historyRow.key; });
    if (idx >= 0) historyList[idx] = historyRow; else historyList.push(historyRow);

    dirtyKeys.clear();
    dailyDutyDirty = false;
    if (session === 'STAYIN') stayInLastSaved = new Date(); else lastSaved = new Date();
    showToast('Saved to this device.');

    if (session === 'AM') {
      var n = carryForwardAmToPm_();
      if (n) showToast('Carried ' + n + ' AM result(s) forward to PM.');
    } else if (session === 'PM') {
      var n2 = carryForwardPmToStayIn_();
      if (n2) showToast('Carried ' + n2 + ' result(s) into Stay-in Strength.');
    }
    render();
  }

  async function refresh() {
    APP.subUnits = await idbGetAll('subUnits');
    APP.employees = await idbGetAll('employees');
    APP.superiors = await idbGetAll('superiors');
    if (mainTab === 'stayin') stayInLastRefreshed = new Date(); else lastRefreshed = new Date();
    render();
  }

  // ================= CARRY-FORWARD / AUTO-FILL =================
  function autoFillActiveLeaves_() {
    var todayStr = APP.date;
    var filled = 0;
    APP.employees.forEach(function (emp) {
      if (!isActiveForParade_(emp)) return;
      var sessions = isTrue(emp.isStayIn) ? ['AM', 'PM', 'STAYIN'] : ['AM', 'PM'];
      sessions.forEach(function (sess) {
        var hasExisting = APP.attendance.filter(function (r) { return r.empId === emp.id && r.session === sess; }).length > 0;
        if (hasExisting) return;
        for (var i = historyList.length - 1; i >= 0; i--) {
          var people = (historyList[i].snapshot && historyList[i].snapshot.people) || [];
          var personRec = people.filter(function (p) { return p.id === emp.id; })[0];
          if (!personRec || !personRec.reason) continue;
          var parsed = parseAnyMultiDayReason_(personRec.reason);
          if (!parsed) continue;
          if (parsed.startDate <= todayStr && todayStr <= parsed.endDate) {
            applyAttendanceLocal({ empId: emp.id, session: sess, status: 'Out', reason: personRec.reason, bucket: personRec.bucket || bucketForReasonLocal(personRec.reason) });
            dirtyKeys.add(emp.id + '|' + sess);
            filled++;
            break;
          }
        }
      });
    });
    return filled;
  }
  function carryForwardAmToPm_() {
    var filled = 0;
    var AM_ONLY = ['AM MA', 'AM LL', 'AM OSL'];
    APP.employees.forEach(function (emp) {
      if (!isActiveForParade_(emp)) return;
      var amRec = APP.attendance.filter(function (r) { return r.empId === emp.id && r.session === 'AM'; })[0];
      if (!amRec || amRec.bucket === 'In') return;
      var hasPM = APP.attendance.filter(function (r) { return r.empId === emp.id && r.session === 'PM'; }).length > 0;
      if (hasPM) return;
      if (AM_ONLY.indexOf(amRec.reason) !== -1) {
        applyAttendanceLocal({ empId: emp.id, session: 'PM', status: 'Out', reason: '', bucket: 'Out' });
      } else {
        applyAttendanceLocal({ empId: emp.id, session: 'PM', status: 'Out', reason: amRec.reason, bucket: amRec.bucket });
      }
      dirtyKeys.add(emp.id + '|PM');
      filled++;
    });
    return filled;
  }
  /** PM Parade State -> that same day's Stay-in Strength. Carries MC and
   *  anything in the 'others' category (GD, ASA, RSO, OOC, MEDIC DUTY, MED
   *  COVER, BR COHESION, LATE, SKILLSFUTURE, COURSE, BR WORK, OTHER) — not
   *  OSL/LL/OFF/MA, which stay PM-only. */
  function carryForwardPmToStayIn_() {
    var filled = 0;
    APP.employees.forEach(function (emp) {
      if (!isActiveForParade_(emp) || !isTrue(emp.isStayIn)) return;
      var pmRec = APP.attendance.filter(function (r) { return r.empId === emp.id && r.session === 'PM'; })[0];
      if (!pmRec || pmRec.bucket === 'In') return;
      var baseName = baseReasonNameOf_(pmRec.reason);
      var shouldCarry = baseName === 'MC' || REASON_CATEGORY_OF_NAME[baseName] === 'others';
      if (!shouldCarry) return;
      var hasExisting = APP.attendance.filter(function (r) { return r.empId === emp.id && r.session === 'STAYIN'; }).length > 0;
      if (hasExisting) return;
      applyAttendanceLocal({ empId: emp.id, session: 'STAYIN', status: 'Out', reason: pmRec.reason, bucket: pmRec.bucket });
      dirtyKeys.add(emp.id + '|STAYIN');
      filled++;
    });
    return filled;
  }
  /** Yesterday's saved Stay-in Strength -> today's AM. Only carries 'others'
   *  category reasons (GD, ASA, RSO, OOC, MEDIC DUTY, MED COVER, BR COHESION,
   *  LATE, SKILLSFUTURE, COURSE, BR WORK, OTHER) — MC continuing into today is
   *  handled separately by autoFillActiveLeaves_ (multi-day MC/OSL/LL from
   *  history), and OSL/LL/OFF continuing or starting today by the absence-
   *  records sync (applyLocalAbsenceRecordsToToday_). Keeping those on their
   *  own mechanisms avoids this rule double-applying or conflicting with them. */
  function carryForwardStayInAbsencesToNextAm_() {
    var filled = 0;
    var yesterday = previousDayIso_(APP.date);
    var stayInRecord = historyList.filter(function (h) { return h.date === yesterday && h.session === 'STAYIN'; })[0];
    if (!stayInRecord) return 0;
    var people = (stayInRecord.snapshot && stayInRecord.snapshot.people) || [];
    people.forEach(function (p) {
      if (p.bucket === 'In') return;
      var baseName = baseReasonNameOf_(p.reason);
      if (REASON_CATEGORY_OF_NAME[baseName] !== 'others') return;
      var emp = APP.employees.filter(function (e) { return e.id === p.id; })[0];
      if (!emp || !isActiveForParade_(emp)) return;
      var hasExisting = APP.attendance.filter(function (r) { return r.empId === p.id && r.session === 'AM'; }).length > 0;
      if (hasExisting) return;
      applyAttendanceLocal({ empId: p.id, session: 'AM', status: 'Out', reason: p.reason, bucket: p.bucket });
      dirtyKeys.add(p.id + '|AM');
      filled++;
    });
    return filled;
  }
  /** Anyone with an MC, OSL/LL, or OFF absence record covering TOMORROW (the
   *  day after Stay-in Strength's own date) gets marked absent in TODAY'S
   *  Stay-in Strength too — someone who knows they're on MC/leave/off
   *  starting tomorrow has typically already left camp tonight rather than
   *  staying in and leaving first thing in the morning. This is separate
   *  from carryForwardStayInAbsencesToNextAm_ (which looks backward, from
   *  yesterday's Stay-in into today's AM) — this looks forward, checking
   *  what's coming up next against tonight's headcount. Only checks MC/
   *  Leaves/Offs absence records — not MA or 'others', which are covered by
   *  the same-day PM reference in carryForwardPmToStayIn_ instead. */
  function applyNextDayAbsencesToStayIn_() {
    var filled = 0;
    var tomorrow = nextDayIso_(APP.date);
    var relevantCats = ['mc', 'leaves', 'offs', 'ma'];
    APP.employees.forEach(function (emp) {
      if (!isActiveForParade_(emp) || !isTrue(emp.isStayIn)) return;
      var hasExisting = APP.attendance.filter(function (r) { return r.empId === emp.id && r.session === 'STAYIN'; }).length > 0;
      if (hasExisting) return;
      for (var ci = 0; ci < relevantCats.length; ci++) {
        var catKey = relevantCats[ci];
        var listKey = REASON_CATEGORIES[catKey].listKey;
        var candidates = (APP[listKey] || []).filter(function (r) { return r.employeeId === emp.id && coversDate_(r, tomorrow); });
        // 'ma' category covers both AM MA and PM MA — only AM MA carries into tonight's Stay-in
        var match = catKey === 'ma' ? candidates.filter(function (r) { return baseReasonNameOf_(r.reason) === 'AM MA'; })[0] : candidates[0];
        if (match) {
          var bucket = bucketForReasonLocal(baseReasonNameOf_(match.reason) || match.reason);
          applyAttendanceLocal({ empId: emp.id, session: 'STAYIN', status: 'Out', reason: match.reason, bucket: bucket });
          dirtyKeys.add(emp.id + '|STAYIN');
          filled++;
          break;
        }
      }
    });
    return filled;
  }
  /** Direction A: saved absence records -> today's live view. For every record
   *  (across all 5 categories) whose range covers today, apply it to anyone who
   *  doesn't already have an explicit attendance entry for that session today. */
  function applyLocalAbsenceRecordsToToday_() {
    Object.keys(REASON_CATEGORIES).forEach(function (catKey) {
      var listKey = REASON_CATEGORIES[catKey].listKey;
      (APP[listKey] || []).forEach(function (rec) {
        if (!coversDate_(rec, APP.date)) return;
        var bucket = bucketForReasonLocal(baseReasonNameOf_(rec.reason) || rec.reason);
        reasonSessionsFor_(rec.reasonName).forEach(function (sess) {
          var hasExisting = APP.attendance.filter(function (r) { return r.empId === rec.employeeId && r.session === sess; }).length > 0;
          if (hasExisting) return;
          applyAttendanceLocal({ empId: rec.employeeId, session: sess, status: bucket === 'In' ? 'In' : 'Out', reason: rec.reason, bucket: bucket });
        });
      });
    });
  }

  /** Direction B: live picker -> saved absence record. Called after every
   *  attendance-changing action in the live picker. First removes whichever
   *  existing record (in any category) currently covers today for this
   *  employee, then, if the newly-applied reason belongs to one of the 5
   *  categories, writes a fresh record for it. All in-memory (APP) updates
   *  happen synchronously before any IndexedDB write, so a caller's render()
   *  right after calling this always sees the final, consistent state —
   *  the actual persistence to IndexedDB then happens in the background. */
  function syncAbsenceRecordForLocal_(empId, reasonName, reasonString, startDate, days) {
    var todayStr = APP.date;
    var toDelete = [];
    Object.keys(REASON_CATEGORIES).forEach(function (catKey) {
      var listKey = REASON_CATEGORIES[catKey].listKey;
      var keep = [];
      (APP[listKey] || []).forEach(function (r) {
        if (r.employeeId === empId && coversDate_(r, todayStr)) toDelete.push(r.id); else keep.push(r);
      });
      APP[listKey] = keep;
    });

    var newRec = null;
    var catKey = REASON_CATEGORY_OF_NAME[reasonName];
    if (catKey && reasonName) {
      var listKey = REASON_CATEGORIES[catKey].listKey;
      newRec = { id: uid_(), employeeId: empId, reasonName: reasonName, reason: reasonString, startDate: startDate, days: days, createdAt: new Date().toISOString() };
      APP[listKey].push(newRec);
    }

    if (catKey === 'mc' || catKey === 'leaves' || catKey === 'offs' || catKey === 'ma') applyNextDayAbsencesToStayIn_();

    (async function persist() {
      for (var i = 0; i < toDelete.length; i++) await idbDelete('absenceRecords', toDelete[i]);
      if (newRec) await idbBulkPut('absenceRecords', [newRec]);
    })();
  }

  function runAutoFillPass_() {
    var n1 = autoFillActiveLeaves_();
    var n2 = carryForwardAmToPm_();
    var n3 = carryForwardPmToStayIn_();
    var n4 = carryForwardStayInAbsencesToNextAm_();
    var n5 = applyNextDayAbsencesToStayIn_();
    applyLocalAbsenceRecordsToToday_();
    if (n1 || n2 || n3 || n4 || n5) showToast('Auto-marked ' + (n1 + n2 + n3 + n4 + n5) + ' record(s) — review before saving.');
  }

  // ================= CHANGE DATE (simplified — no conflict-typing guard, single-user local app) =================

        '<button class="btn full" id="dateChangeContinueBtn" style="margin-bottom:8px;">CONTINUE</button>' +
        '<button class="modal-close" id="modalClose">CANCEL</button></div></div>';

    return '<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet">' +
      '<h3>Record Already Exists</h3><div class="sub">' + esc(dateChangeModal.conflictInfo) + ' Type PROCEED to continue anyway.</div>' +
      '<input type="text" id="dateChangeConfirmInput" style="width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;margin-bottom:14px;" placeholder="Type PROCEED" autocomplete="off" autocapitalize="off">' +
      '<button class="btn full danger" id="dateChangeProceedBtn" style="margin-bottom:8px;">PROCEED</button>' +
      '<button class="modal-close" id="modalClose">CANCEL</button></div></div>';
  }
  function renderDateChangeModal() {
    document.getElementById('modalRoot').innerHTML = dateChangeModalHtml();
    document.getElementById('modalOverlay').addEventListener('click', function (ev) { if (ev.target.id === 'modalOverlay') closeDateChangeModal(); });
    document.getElementById('modalClose').addEventListener('click', closeDateChangeModal);
    if (dateChangeModal.step === 'pick') {
      var dateInput = document.getElementById('dateChangeInput');
      document.getElementById('dateChangeContinueBtn').addEventListener('click', function () {
        if (!dateInput.value) { showToast('Please pick a date.'); return; }
        checkDateAndProceed_(dateInput.value);
      });
    } else {

  // ================= EXPORT =================
  function buildExportText_(opts) {
    var timeLabel = opts.timeLabel || (opts.session === 'AM' ? '0745HRS' : '1715HRS');
    var total = opts.people.length;
    var present = opts.people.filter(function (p) { return p.bucket === 'In'; }).length;

    var lines = [];
    lines.push((APP.companyName || 'BDE HQ Company') + ' (Strength as of ' + opts.label + ', ' + formatDDMMYY_(opts.dateIso) + ', ' + timeLabel + ')');
    lines.push('');
    lines.push('CDO -' + (opts.cdo ? ' ' + opts.cdo.toUpperCase() : ''));
    lines.push('CDS -' + (opts.cds ? ' ' + opts.cds.toUpperCase() : ''));
    lines.push('');
    lines.push('Total - ' + total);
    lines.push('Present - ' + present);

    var groups = {}, order = [];
    opts.people.forEach(function (p) {
      var g = p.subUnit || '—';
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(p);
    });

    order.forEach(function (g) {
      var members = groups[g];
      if (!members.length) return;
      var presentCount = members.filter(function (p) { return p.bucket === 'In'; }).length;
      lines.push('');
      lines.push(g + ' - ' + presentCount + '/' + members.length);
      members.forEach(function (p) {
        if (p.bucket === 'In') {
          lines.push(p.rank + ' ' + p.name + ' \u2705');
        } else {
          var reasonText = formatReasonForExport_(p.reason) || BUCKET_LABEL[p.bucket] || p.bucket;
          lines.push(p.rank + ' ' + p.name + ' \u274c (' + reasonText + ')');
        }
      });
    });

    return lines.join('\n');
  }
  function buildStayInExportText_(opts) {
    var total = opts.people.length;
    var present = opts.people.filter(function (p) { return p.bucket === 'In'; }).length;
    var lines = [];
    lines.push(formatDDMMYY_(opts.dateIso) + ' Stay in Strength: ' + present + '/' + total);
    lines.push('');
    lines.push('CDS -' + (opts.cds ? ' ' + opts.cds.toUpperCase() : ''));
    lines.push('');
    opts.people.forEach(function (p, i) {
      if (p.bucket === 'In') lines.push((i + 1) + '. ' + p.rank + ' ' + p.name + ' \u2705');
      else {
        var reasonText = formatReasonForExport_(p.reason) || BUCKET_LABEL[p.bucket] || p.bucket;
        lines.push((i + 1) + '. ' + p.rank + ' ' + p.name + ' \u274c (' + reasonText + ')');
      }
    });
    return lines.join('\n');
  }

  function submitAbsenceForm_(catKey) {
    var cat = REASON_CATEGORIES[catKey];
    var listKey = cat.listKey;

    if (!absenceForm.employeeId) { showToast('Please select an employee.'); return; }
    if (!absenceForm.reasonName) { showToast('Please select a reason.'); return; }
    if (!absenceForm.date) { showToast('Please fill in the date.'); return; }

    var fields = adminFieldsFor_(absenceForm.reasonName);
    var result;
    if (fields.needsDays && fields.needsText) result = buildTextDatesReasonString_(absenceForm.reasonName, absenceForm.text, absenceForm.days, absenceForm.date);
    else if (fields.needsDays) result = buildDatesReasonString_(absenceForm.reasonName, absenceForm.days, absenceForm.date);
    else if (fields.needsText) result = buildTextReasonString_(absenceForm.reasonName, absenceForm.text, fields.textPlaceholder);
    else result = { ok: true, value: absenceForm.reasonName };
    if (!result.ok) { showToast(result.message); return; }

    var days = fields.needsDays ? absenceForm.days : 1;
    var wasEditing = editingAbsence.catKey === catKey && editingAbsence.id;
    var rec;
    if (wasEditing) {
      rec = APP[listKey].filter(function (r) { return r.id === editingAbsence.id; })[0];
      if (rec) { rec.employeeId = absenceForm.employeeId; rec.reasonName = absenceForm.reasonName; rec.reason = result.value; rec.startDate = absenceForm.date; rec.days = days; }
    } else {
      rec = { id: uid_(), employeeId: absenceForm.employeeId, reasonName: absenceForm.reasonName, reason: result.value, startDate: absenceForm.date, days: days, createdAt: new Date().toISOString() };
      APP[listKey].push(rec);
    }
    idbBulkPut('absenceRecords', [rec]);

    if (coversDate_({ startDate: absenceForm.date, days: days }, APP.date)) {
      var bucket = bucketForReasonLocal(baseReasonNameOf_(result.value) || result.value);
      reasonSessionsFor_(absenceForm.reasonName).forEach(function (s) {
        applyAttendanceLocal({ empId: absenceForm.employeeId, session: s, status: bucket === 'In' ? 'In' : 'Out', reason: result.value, bucket: bucket });
      });
    }
    if (catKey === 'mc' || catKey === 'leaves' || catKey === 'offs' || catKey === 'ma') applyNextDayAbsencesToStayIn_();

    editingAbsence = { catKey: null, id: null };
    absenceForm = { employeeId: '', reasonName: '', days: 1, date: '', endDate: '', text: '' };
    render();
    showToast(wasEditing ? 'Record updated.' : 'Record added.');

  function parseTextReasonString_(reasonName, reasonStr) {
    if (!reasonStr) return null;
    var prefix = reasonName + ' ';
    if (reasonStr.indexOf(prefix) === 0) return { text: reasonStr.slice(prefix.length) };
    return null;
  }
  function parseTextDatesReasonString_(reasonName, reasonStr) {
    if (!reasonStr) return null;
    var escaped = reasonName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var multi = reasonStr.match(new RegExp('^(\\d+)D ' + escaped + ' (.+) (\\d{6})-(\\d{6})$'));
    if (multi) return { days: parseInt(multi[1], 10), text: multi[2], startDate: ddmmyyToIso_(multi[3]), endDate: ddmmyyToIso_(multi[4]) };
    var single = reasonStr.match(new RegExp('^' + escaped + ' (.+) (\\d{6})$'));
    if (single) return { days: 1, text: single[1], startDate: ddmmyyToIso_(single[2]), endDate: '' };
    return null;
  }
  function startEditAbsence_(catKey, id) {
    var cat = REASON_CATEGORIES[catKey];
    var rec = (APP[cat.listKey] || []).filter(function (r) { return r.id === id; })[0];
    if (!rec) return;
    var days = parseInt(rec.days, 10) || 1;
    var fields = adminFieldsFor_(rec.reasonName);
    var text = '';
    if (fields.needsText) {
      var parsed = fields.needsDays ? parseTextDatesReasonString_(rec.reasonName, rec.reason) : parseTextReasonString_(rec.reasonName, rec.reason);
      if (parsed) text = parsed.text;
    }
    var endDate = fields.needsDays ? addWeekdaysIso_(rec.startDate, days) : '';
    absenceForm = { employeeId: rec.employeeId, reasonName: rec.reasonName, days: days, date: rec.startDate, endDate: endDate, text: text };
    editingAbsence = { catKey: catKey, id: id };
    render();
  }

  // ================= HISTORY =================
  function getFilteredHistory() {
    return historyList.filter(function (h) {
      if (historyDateFilter && h.date !== historyDateFilter) return false;
      if (h.session === 'AM' && !historyShowAM) return false;
      if (h.session === 'PM' && !historyShowPM) return false;
      if (h.session === 'STAYIN' && !historyShowStayIn) return false;
      return true;
    }).sort(function (a, b) { return b.date.localeCompare(a.date) || b.session.localeCompare(a.session); });
  }
  function historyTimeLabel(sess) { if (sess === 'STAYIN') return ''; return sess === 'AM' ? '0745HRS' : '1715HRS'; }
  function historyRowHtml(h) {
    var cls = h.session === 'AM' ? 'fp' : h.session === 'PM' ? 'lp' : 'stayin';
    var title = h.session === 'AM' ? 'AM Parade State' : h.session === 'PM' ? 'PM Parade State' : 'Stay-in Strength';
    var snap = h.snapshot || {};
    var line2Parts = [formatHistDate(h.date)];
    var tl = historyTimeLabel(h.session); if (tl) line2Parts.push(tl);
    line2Parts.push('Total ' + (snap.total != null ? snap.total : '—'));
    line2Parts.push('Present ' + (snap.present != null ? snap.present : '—'));
    return '<div class="datarow ' + cls + '" data-histkey="' + esc(h.key) + '"><div class="title">' + esc(title) + '</div><div class="line2">' + esc(line2Parts.join(' · ')) + '</div></div>';
  }
  function historyHtml() {
    var results = getFilteredHistory();
    var html = '<h2 style="margin-bottom:10px;">HISTORY</h2>';
    html += '<div class="field-row"><label>Date filter</label><input type="date" id="historyDateFilter" value="' + esc(historyDateFilter) + '"></div>';
    html += '<div class="check-row">' +
      '<label class="check-label"><input type="checkbox" id="histFilterAM" ' + (historyShowAM ? 'checked' : '') + '> AM PARADE</label>' +
      '<label class="check-label"><input type="checkbox" id="histFilterPM" ' + (historyShowPM ? 'checked' : '') + '> PM PARADE</label>' +
      '<label class="check-label"><input type="checkbox" id="histFilterStayIn" ' + (historyShowStayIn ? 'checked' : '') + '> STAY-IN</label></div>';
    html += results.map(historyRowHtml).join('') || '<div class="empty-hint">No saved records match this filter.</div>';
    return html;
  }
  function bindHistoryEvents() {
    var dateInput = document.getElementById('historyDateFilter');
    if (dateInput) dateInput.addEventListener('change', function () { historyDateFilter = dateInput.value; render(); });
    var amCheck = document.getElementById('histFilterAM'); if (amCheck) amCheck.addEventListener('change', function () { historyShowAM = amCheck.checked; render(); });
    var pmCheck = document.getElementById('histFilterPM'); if (pmCheck) pmCheck.addEventListener('change', function () { historyShowPM = pmCheck.checked; render(); });
    var siCheck = document.getElementById('histFilterStayIn'); if (siCheck) siCheck.addEventListener('change', function () { historyShowStayIn = siCheck.checked; render(); });
    document.querySelectorAll('[data-histkey]').forEach(function (row) {
      row.addEventListener('click', function () { openHistoryView(row.getAttribute('data-histkey')); });
    });
  }
  function openHistoryView(key) {
    var h = historyList.filter(function (x) { return x.key === key; })[0];
    if (!h) return;
    historyViewKey = key;
    historyViewMeta = { date: h.date, session: h.session, cds: h.snapshot.cds, cdo: h.snapshot.cdo, timeLabel: h.snapshot.timeLabel };
    historyViewPeople = h.snapshot.people || [];
    historyViewFilter = 'ALL'; historyViewSubFilter = 'ALL';
    render();
  }
  function closeHistoryView() { historyViewKey = null; render(); }
  function matchesHistoryViewFilter(bucket) {
    if (historyViewFilter === 'ALL') return true;
    if (historyViewFilter === 'OUT') return bucket !== 'In';
    var map = { IN: 'In', ONDUTY: 'OnDuty', LEAVE: 'Leave', MC: 'MC' };
    return bucket === map[historyViewFilter];
  }
  function historyViewRowHtml(p) {
    var cls = BUCKET_CLASS[p.bucket] || 'out';
    var label = p.reason || BUCKET_LABEL[p.bucket] || p.bucket;
    var sub = historyViewMeta.session === 'STAYIN' ? label : historyViewMeta.session + ' · ' + label;
    return '<div class="emprow ' + cls + ' readonly"><div class="name"><span class="rank">' + esc(p.rank) + '</span>' + esc(p.name) + '</div><div class="substatus">' + esc(sub) + '</div></div>';
  }
  function historyViewFlatListHtml() {
    var rows = historyViewPeople.map(function (p) { if (!matchesHistoryViewFilter(p.bucket)) return ''; return historyViewRowHtml(p); }).join('');
    return rows.trim() === '' ? '<div class="empty-hint">No one matches this filter.</div>' : '<div class="emp-grid">' + rows + '</div>';
  }
  function historyViewGroupsHtml() {
    var groups = [];
    historyViewPeople.forEach(function (p) { if (p.subUnit && groups.indexOf(p.subUnit) === -1) groups.push(p.subUnit); });
    var html = '', any = false;
    groups.forEach(function (g) {
      if (historyViewSubFilter !== 'ALL' && g !== historyViewSubFilter) return;
      var members = historyViewPeople.filter(function (p) { return p.subUnit === g; });
      var rows = members.map(function (p) { if (!matchesHistoryViewFilter(p.bucket)) return ''; return historyViewRowHtml(p); }).join('');
      if (rows.trim() === '') return;
      any = true;
      html += '<div class="group"><div class="group-title">' + esc(g) + '</div><div class="emp-grid">' + rows + '</div></div>';
    });
    return any ? html : '<div class="empty-hint">No one matches this filter.</div>';
  }
  function historyViewHtml() {
    var meta = historyViewMeta, people = historyViewPeople, isStayIn = meta.session === 'STAYIN';
    var counts = { In: 0, Out: 0, OnDuty: 0, Leave: 0, MC: 0 };
    people.forEach(function (p) { counts[p.bucket] = (counts[p.bucket] || 0) + 1; });
    var total = people.length;
    var html = '<button class="back-link" id="btnHistoryViewBack">‹ BACK TO HISTORY</button>';
    var title = isStayIn ? 'STAY-IN STRENGTH' : (meta.session === 'AM' ? 'AM PARADE' : 'PM PARADE');
    html += '<div class="segmented"><div class="seg-btn active" style="flex:1;cursor:default;">' + title + ' <span class="count">' + total + '</span></div></div>';
    html += '<div class="export-row"><button class="btn ghost full" id="btnHistoryExport">EXPORT</button></div>';
    html += '<div class="statgrid">' + statCard('in', counts.In, 'IN') + statCard('out', total - counts.In, 'OUT') + statCard('onduty', counts.OnDuty, 'ON DUTY') + statCard('leave', counts.Leave, 'LEAVES') + statCard('mc', counts.MC, 'MC') + statCard('total', total, 'TOTAL') + '</div>';
    html += '<div class="sectionhead"><h2>' + esc(isStayIn ? 'STAY-IN STRENGTH' : 'PARADE STATE') + ' · ' + esc(formatHistDate(meta.date)) + '</h2></div>';
    if (!isStayIn) {
      var subUnitsInSnap = []; people.forEach(function (p) { if (p.subUnit && subUnitsInSnap.indexOf(p.subUnit) === -1) subUnitsInSnap.push(p.subUnit); });
      html += '<div class="chiprow"><button class="chip ' + (historyViewSubFilter === 'ALL' ? 'active' : '') + '" data-histview-subfilter="ALL">ALL SUB-UNITS</button>' +
        subUnitsInSnap.map(function (n) { return '<button class="chip ' + (historyViewSubFilter === n ? 'active' : '') + '" data-histview-subfilter="' + esc(n) + '">' + esc(n) + '</button>'; }).join('') + '</div>';
    }
    html += '<div class="selector-row"><label>CDS</label><div class="selector-static">' + esc(meta.cds || '—') + '</div></div>';
    if (!isStayIn) html += '<div class="selector-row"><label>CDO</label><div class="selector-static">' + esc(meta.cdo || '—') + '</div></div>';
    html += '<div class="chiprow">' + ['ALL', 'IN', 'OUT', 'ONDUTY', 'LEAVE', 'MC'].map(function (k) {
      var labels = { ALL: 'ALL', IN: 'IN', OUT: 'OUT', ONDUTY: 'ON DUTY', LEAVE: 'LEAVES', MC: 'MC' };
      return '<button class="chip ' + (historyViewFilter === k ? 'active' : '') + '" data-histview-filter="' + k + '">' + labels[k] + '</button>';
    }).join('') + '</div>';
    html += '<div>' + (isStayIn ? historyViewFlatListHtml() : historyViewGroupsHtml()) + '</div>';
    return html;
  }
  function bindHistoryViewEvents() {
    var backBtn = document.getElementById('btnHistoryViewBack'); if (backBtn) backBtn.addEventListener('click', closeHistoryView);
    var exportBtn = document.getElementById('btnHistoryExport');
    if (exportBtn) exportBtn.addEventListener('click', function () {
      openExportModal({ label: historyViewMeta.session === 'AM' ? 'FP' : 'LP', dateIso: historyViewMeta.date, session: historyViewMeta.session, timeLabel: historyViewMeta.timeLabel, cds: historyViewMeta.cds, cdo: historyViewMeta.cdo, people: historyViewPeople });
    });
    document.querySelectorAll('[data-histview-filter]').forEach(function (c) { c.addEventListener('click', function () { historyViewFilter = c.getAttribute('data-histview-filter'); render(); }); });
    document.querySelectorAll('[data-histview-subfilter]').forEach(function (c) { c.addEventListener('click', function () { historyViewSubFilter = c.getAttribute('data-histview-subfilter'); render(); }); });
  }

  // ================= MAIN RENDER / BIND =================
  function render() {
    var view = document.getElementById('view');
    var html;
    if (historyViewKey && mainTab === 'history') { html = historyViewHtml(); }
    else if (mainTab === 'parade') html = paradeHtml();
    else if (mainTab === 'stayin') html = stayInHtml();
    else if (mainTab === 'history') html = historyHtml();
    else html = updateDataHtml();
    view.innerHTML = html;

    document.querySelectorAll('.maintab').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === mainTab); });

    if (historyViewKey && mainTab === 'history') bindHistoryViewEvents();
    else if (mainTab === 'parade') bindParadeEvents();
    else if (mainTab === 'stayin') bindStayInEvents();
    else if (mainTab === 'history') bindHistoryEvents();
    else bindUpdateDataEvents();
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.maintab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var newTab = btn.getAttribute('data-tab');
        if (newTab === 'stayin' && session !== 'STAYIN') { lastParadeSession = session; session = 'STAYIN'; }
        else if (newTab !== 'stayin' && session === 'STAYIN') { session = lastParadeSession; }
        mainTab = newTab;
        historyViewKey = null;
        if (mainTab === 'stayin') { carryForwardPmToStayIn_(); applyNextDayAbsencesToStayIn_(); }
        window.scrollTo(0, 0);
        render();
      });
    });
    boot();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    }
  });
</script>
</body>
</html>
